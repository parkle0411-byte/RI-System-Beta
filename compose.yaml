name: ri-system

services:
  mysql:
    # MySQL 8.4.11，固定在「目前正在跑的那一個映像」的摘要（8.4.11 標籤之後被重新打包過，底層不同）
    image: mysql@sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
    container_name: ri-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ri_system
      MYSQL_USER: ri_app
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
      TZ: Asia/Taipei

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --transaction-isolation=READ-COMMITTED
      # 2026-10-15：緩衝區預設 128MB 小於案件資料表（1 萬件約 180MB），每次掃全部案件都有約 1/4 要讀磁碟
      - --innodb-buffer-pool-size=536870912

    volumes:
      - mysql_data:/var/lib/mysql

    secrets:
      - mysql_root_password
      - mysql_app_password

    networks:
      - backend

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ./backend
    image: ri-backend:local
    container_name: ri-backend
    restart: unless-stopped
    user: "1001:1001"

    environment:
      DJANGO_DEBUG: "false"
      # 同事用 http://ri-dev.tw-insure.com（公司 DNS 已指向 192.168.1.127）；短名 ri-dev 靠 DNS 搜尋網域也能連
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,192.168.1.127,ri-dev.tw-insure.com,ri-dev"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://ri-dev.tw-insure.com,http://ri-dev,http://192.168.1.127,http://192.168.1.127:8080,http://localhost:8080,http://127.0.0.1:8080"
      # 提醒信裡「開啟 Reinsurance Department System」的連結
      RI_REMINDER_LINK_URL: "http://ri-dev.tw-insure.com"
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      AUDIT_LOG_ENABLED: "true"
      # Owner requested Audit recording paused until further notice (2026-10-05).
      AUDIT_LOG_PAUSED: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ri_system
      # 平常請求用最小權限的 ri_runtime；migrate 等維護作業用 scripts/manage_as_owner.sh 改回 ri_app
      MYSQL_USER: ri_runtime
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_runtime_password
      TZ: Asia/Taipei

    secrets:
      - django_secret_key
      - mysql_app_password
      - mysql_runtime_password

    volumes:
      # 案件文件的檔案本體（不在 MySQL 備份裡，要另外備份；見 VM-RULES.md「維運」）
      - case_documents:/data/documents

    networks:
      - backend

    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    build:
      context: ./frontend
      additional_contexts:
        django: service:backend  # 從 backend 映像複製 Django admin 的靜態檔
    image: ri-frontend:local
    container_name: ri-nginx
    restart: unless-stopped

    environment:
      TZ: Asia/Taipei

    ports:
      - "80:80"      # http://ri-dev.tw-insure.com（不用打連接埠）
      - "8080:80"    # 舊網址 http://192.168.1.127:8080 繼續可用

    networks:
      - edge
      - backend

    depends_on:
      - backend

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password
  mysql_app_password:
    file: ./secrets/mysql_app_password
  django_secret_key:
    file: ./secrets/django_secret_key
  mysql_runtime_password:
    file: ./secrets/mysql_runtime_password

volumes:
  mysql_data:
  case_documents:

networks:
  backend:
    internal: true
  edge:
