name: ri-system

services:
  mysql:
    image: mysql:8.4
    container_name: ri-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ri_system
      MYSQL_USER: ri_app
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
      TZ: Asia/Taipei

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --transaction-isolation=READ-COMMITTED

    volumes:
      - mysql_data:/var/lib/mysql

    secrets:
      - mysql_root_password
      - mysql_app_password

    networks:
      - backend

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ./backend
    image: ri-backend:local
    container_name: ri-backend
    restart: unless-stopped
    user: "1001:1001"

    environment:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,192.168.1.127"
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      AUDIT_LOG_ENABLED: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ri_system
      # 平常請求用最小權限的 ri_runtime；migrate 等維護作業用 scripts/manage_as_owner.sh 改回 ri_app
      MYSQL_USER: ri_runtime
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_runtime_password
      TZ: Asia/Taipei

    secrets:
      - django_secret_key
      - mysql_app_password
      - mysql_runtime_password

    networks:
      - backend

    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    build:
      context: ./frontend
    image: ri-frontend:local
    container_name: ri-nginx
    restart: unless-stopped

    environment:
      TZ: Asia/Taipei

    ports:
      - "8080:80"

    networks:
      - edge
      - backend

    depends_on:
      - backend

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password
  mysql_app_password:
    file: ./secrets/mysql_app_password
  django_secret_key:
    file: ./secrets/django_secret_key
  mysql_runtime_password:
    file: ./secrets/mysql_runtime_password

volumes:
  mysql_data:

networks:
  backend:
    internal: true
  edge:
