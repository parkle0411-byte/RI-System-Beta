name: ri-system

services:
  mysql:
    # MySQL 8.4.11，固定在「目前正在跑的那一個映像」的摘要（8.4.11 標籤之後被重新打包過，底層不同）
    image: mysql@sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
    container_name: ri-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ri_system
      MYSQL_USER: ri_app
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
      TZ: Asia/Taipei

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --transaction-isolation=READ-COMMITTED

    volumes:
      - mysql_data:/var/lib/mysql

    secrets:
      - mysql_root_password
      - mysql_app_password

    networks:
      - backend

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ./backend
    image: ri-backend:local
    container_name: ri-backend
    restart: unless-stopped
    user: "1001:1001"

    environment:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,192.168.1.127"
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      AUDIT_LOG_ENABLED: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ri_system
      # 平常請求用最小權限的 ri_runtime；migrate 等維護作業用 scripts/manage_as_owner.sh 改回 ri_app
      MYSQL_USER: ri_runtime
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_runtime_password
      TZ: Asia/Taipei

    secrets:
      - django_secret_key
      - mysql_app_password
      - mysql_runtime_password

    volumes:
      # 案件文件的檔案本體（不在 MySQL 備份裡，要另外備份；見 MIGRATION-STATUS.md「維運」）
      - case_documents:/data/documents

    networks:
      - backend
      - pdf

    depends_on:
      mysql:
        condition: service_healthy

  pdf:
    # 產生 PDF（對應 Alpha 用的 Hatchable 無頭 Chromium）：Gotenberg 8.37.0（Chromium 152；內含 Liberation Sans 與 Noto CJK 字型），
    # 固定在映像摘要。只在內部網路 pdf 上，沒有對外埠、連不到 MySQL 也連不到網際網路；只有 backend 會呼叫它。
    image: gotenberg/gotenberg:8.37.0@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769
    container_name: ri-pdf
    restart: unless-stopped
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /home/gotenberg:size=64m,uid=1001,gid=1001,mode=0700
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      # 只允許 Chromium 讀 Gotenberg 自己放在 /tmp 的 index.html（圖片都是內嵌的 data: URI）
      - --chromium-allow-list=^file:///tmp/.*
      - --chromium-deny-public-ips=true
      - --chromium-deny-private-ips=true
      - --chromium-max-concurrency=2
      - --api-timeout=40s
      - --api-body-limit=8MB
      - --api-disable-download-from=true
      - --libreoffice-disable-routes=true
      - --pdfengines-disable-routes=true
      - --webhook-disable=true
      - --prometheus-disable-collect=true
      - --log-level=warn
    environment:
      TZ: Asia/Taipei
    mem_limit: 1g
    networks:
      - pdf

  nginx:
    build:
      context: ./frontend
      additional_contexts:
        django: service:backend  # 從 backend 映像複製 Django admin 的靜態檔
    image: ri-frontend:local
    container_name: ri-nginx
    restart: unless-stopped

    environment:
      TZ: Asia/Taipei

    ports:
      - "8080:80"

    networks:
      - edge
      - backend

    depends_on:
      - backend

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password
  mysql_app_password:
    file: ./secrets/mysql_app_password
  django_secret_key:
    file: ./secrets/django_secret_key
  mysql_runtime_password:
    file: ./secrets/mysql_runtime_password

volumes:
  mysql_data:
  case_documents:

networks:
  backend:
    internal: true
  pdf:
    internal: true
  edge:
