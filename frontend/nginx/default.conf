# Reset links contain credentials. Keep them out of request and referrer logs.
map $request_uri $safe_request {
    default $request;
    ~^/reset-password(?:\?|$) "$request_method /reset-password $server_protocol";
}
map $http_referer $safe_referer {
    default $http_referer;
    ~*/reset-password(?:\?|$) "password-reset";
}
log_format ri_access '$remote_addr - $remote_user [$time_local] "$safe_request" '
                     '$status $body_bytes_sent "$safe_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 20m;
    access_log /var/log/nginx/access.log ri_access;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Docker 內建 DNS，讓 backend 容器重建後不需重啟 Nginx
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Django 後端（僅經由內部網路轉發）
    location ~ ^/(health|api|admin)/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        # 必須帶 port（$http_host）：Django 的 CSRF 來源檢查會比對 Origin 與 Host
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 唯讀 Django admin 的靜態檔（CSS/JS/圖示），建置時由 backend 映像複製進來
    location /static/ {
        alias /usr/share/nginx/django-static/;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # 帶雜湊檔名的靜態資源可長期快取
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # location 內的 add_header 會取代 server 層的設定，所以安全標頭要在這裡重寫一次
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Vue SPA：登入／重設頁的 HTML 不得留在快取，也不傳送連結中的 token 作為 Referer。
    location / {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ /index.html;
    }
}
